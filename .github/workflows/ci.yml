name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ROJO_VERSION: 7.4.4
      SELENE_VERSION: 0.29.0
      STYLUA_VERSION: 2.1.0
      LUNE_VERSION: 0.10.4
      LUAU_LSP_VERSION: 1.70.1
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          fetch() { curl -fsSL -o tool.zip "$1" && unzip -oq tool.zip && rm tool.zip; }
          fetch "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          fetch "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          fetch "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          fetch "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          fetch "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          curl -fsSL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau"
          chmod +x selene stylua rojo lune luau-lsp
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: StyLua
        run: stylua --check src tests scripts

      - name: Selene
        run: selene src

      - name: Rojo build
        run: rojo build default.project.json --output build/code.rbxl

      - name: Luau type check (strict)
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions="$HOME/bin/globalTypes.d.luau" src

      - name: Unit tests (Lune)
        run: lune run tests/run
